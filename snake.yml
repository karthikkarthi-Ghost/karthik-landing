name: generate animated snake

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate twice a day
  workflow_dispatch: {}       # allow manual trigger from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg/gif
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: karthikkarthi-Ghost
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#3ddc97&color_dots=#1c2532,#0e4429,#006d32,#26a641,#39d353

      - name: push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
